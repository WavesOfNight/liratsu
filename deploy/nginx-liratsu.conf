# Directives nginx additionnelles pour liratsu.fr (reverse proxy vers Next.js/PM2).
# Appliquées en CLI :
#   plesk bin domain --update-web-server-settings liratsu.fr -additional-nginx-settings-file /var/www/vhosts/liratsu.fr/app/current/deploy/nginx-liratsu.conf
# (Plesk vérifie la configuration puis recharge nginx sans coupure.)

client_max_body_size 20m;

location ~ ^/(_next/static)/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
}
